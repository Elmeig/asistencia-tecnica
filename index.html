<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Asistencia Técnica</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" aria-label="Menu">&#9776;</button>
            <div class="header-brand">
                <div class="logo-wrench">🔧</div>
                <span class="logo-text">Asistencia Técnica</span>
            </div>
            <div class="header-stats" id="header-stats">
                <span class="stat-item" id="stat-total" title="Total registros">Total: 0</span>
                <span class="stat-item" id="stat-month" title="Registros este mes">Mes: 0</span>
            </div>
            <div class="header-search">
                <span class="header-search-icon">🔍</span>
                <input type="text" id="global-search-input" placeholder="Buscar en comentarios..." autocomplete="off">
                <span id="global-search-clear" style="display:none">&times;</span>
            </div>
            <div class="header-actions">
                <button id="btn-add-record" class="btn-primary btn-sm" title="Nueva asistencia">
                    ➕ Nueva
                </button>
                <button id="btn-theme" class="theme-btn" title="Cambiar tema">🌙</button>
            </div>
        </header>

        <!-- Sidebar Backdrop (mobile) -->
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- Sidebar (filtros) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>🔍 Filtros</h3>
                <button class="btn-sidebar-close" id="btn-sidebar-close" aria-label="Cerrar filtros">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="filter-group">
                    <label for="filter-client">👤 Cliente</label>
                    <select id="filter-client">
                        <option value="">Todos los clientes</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-machine">⚙️ Máquina</label>
                    <select id="filter-machine">
                        <option value="">Todas las máquinas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-tech">🔧 Técnico</label>
                    <select id="filter-tech">
                        <option value="">Todos los técnicos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-date-from">📅 Desde</label>
                    <input type="date" id="filter-date-from">
                </div>
                <div class="filter-group">
                    <label for="filter-date-to">📅 Hasta</label>
                    <input type="date" id="filter-date-to">
                </div>
                <button class="btn-secondary btn-sm" id="btn-clear-filters" style="width:100%;margin-top:1rem">
                    🗑️ Limpiar filtros
                </button>
                <button class="btn-export" id="btn-export" style="width:100%;margin-top:0.75rem">
                    📊 Exportar Excel
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <div id="records-container"></div>
        </main>

        <!-- Add/Edit Modal -->
        <div class="modal-overlay" id="modal-record">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h2 id="modal-title">📝 Nueva Asistencia</h2>
                    <button class="btn-modal-close" id="btn-modal-close" aria-label="Cerrar">&times;</button>
                </div>
                <form id="record-form" class="modal-form">
                    <div class="form-group">
                        <label for="form-client">👤 Cliente</label>
                        <input type="text" id="form-client" name="client" list="list-clients" required autocomplete="off" placeholder="Nombre del cliente">
                        <datalist id="list-clients"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="form-machine">⚙️ Máquina</label>
                        <input type="text" id="form-machine" name="machine" list="list-machines" required autocomplete="off" placeholder="Ej: R400-136">
                        <datalist id="list-machines"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="form-date">📅 Fecha</label>
                        <input type="date" id="form-date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="form-tech">🔧 Técnico</label>
                        <select id="form-tech" name="tech" required>
                            <option value="">Seleccionar técnico...</option>
                            <option value="RICARDO">Ricardo</option>
                            <option value="MEHDI">Mehdi</option>
                            <option value="JAIME">Jaime</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="form-comments">💬 Comentarios</label>
                        <textarea id="form-comments" name="comments" rows="6" required placeholder="Describe detalladamente la asistencia realizada, problemas encontrados, soluciones aplicadas, repuestos utilizados, etc."></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" id="btn-cancel-modal">❌ Cancelar</button>
                        <button type="submit" class="btn-primary" id="btn-save-record">💾 Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container"></div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
