<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Asistencia Técnica</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" aria-label="Menu">&#9776;</button>
            <div class="header-brand">
                <div class="logo-wrench">&#128295;</div>
                <span class="logo-text">Asistencia T&eacute;cnica</span>
            </div>
            <div class="header-stats" id="header-stats">
                <span class="stat-item" id="stat-total" title="Total">0</span>
                <span class="stat-item" id="stat-month" title="Este mes">0</span>
            </div>
            <div class="header-search">
                <span class="header-search-icon">&#128269;</span>
                <input type="text" id="global-search-input" placeholder="Buscar en comentarios...">
                <span id="global-search-clear" style="display:none">&times;</span>
            </div>
            <div class="header-actions">
                <button id="btn-add-record" class="btn-primary btn-sm" title="Nueva asistencia">+ Nueva</button>
                <button id="btn-theme" class="theme-btn" title="Tema">&#127769;</button>
            </div>
        </header>

        <!-- Sidebar Backdrop (mobile) -->
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- Sidebar (filtros) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Filtros</h3>
                <button class="btn-sidebar-close" id="btn-sidebar-close">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="filter-group">
                    <label>Cliente</label>
                    <select id="filter-client">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>M&aacute;quina</label>
                    <select id="filter-machine">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>T&eacute;cnico</label>
                    <select id="filter-tech">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Desde</label>
                    <input type="date" id="filter-date-from">
                </div>
                <div class="filter-group">
                    <label>Hasta</label>
                    <input type="date" id="filter-date-to">
                </div>
                <button class="btn-secondary btn-sm" id="btn-clear-filters" style="width:100%;margin-top:0.8rem">Limpiar filtros</button>
                <button class="btn-export" id="btn-export" style="width:100%;margin-top:0.5rem">&#128202; Exportar Excel</button>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main">
            <div id="records-container"></div>
        </main>

        <!-- Add/Edit Modal -->
        <div class="modal-overlay" id="modal-record">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h2 id="modal-title">Nueva Asistencia</h2>
                    <button class="btn-modal-close" id="btn-modal-close">&times;</button>
                </div>
                <form id="record-form" class="modal-form">
                    <div class="form-group">
                        <label for="form-client">Cliente</label>
                        <input type="text" id="form-client" name="client" list="list-clients" required autocomplete="off" placeholder="Nombre del cliente">
                        <datalist id="list-clients"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="form-machine">M&aacute;quina</label>
                        <input type="text" id="form-machine" name="machine" list="list-machines" required autocomplete="off" placeholder="Ej: R400-136">
                        <datalist id="list-machines"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="form-date">Fecha</label>
                        <input type="date" id="form-date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="form-tech">T&eacute;cnico</label>
                        <select id="form-tech" name="tech" required>
                            <option value="">Seleccionar...</option>
                            <option value="RICARDO">Ricardo</option>
                            <option value="MEHDI">Mehdi</option>
                            <option value="JAIME">Jaime</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="form-comments">Comentarios</label>
                        <textarea id="form-comments" name="comments" rows="5" required placeholder="Describe la asistencia realizada..."></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" id="btn-cancel-modal">Cancelar</button>
                        <button type="submit" class="btn-primary" id="btn-save-record">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container"></div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
